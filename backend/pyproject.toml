[project]
name = "inec-election-results-agent"
version = "0.1.0"
description = "AI Agent for extracting Nigerian election results from INEC IREV portal"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "INEC Agent Team" }
]

dependencies = [
    # Web Framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    
    # Database
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    
    # Task Queue
    "celery>=5.3.6",
    "redis>=5.0.1",
    
    # Web Scraping
    "playwright>=1.41.0",
    "httpx>=0.26.0",
    
    # OCR and Image Processing
    "pytesseract>=0.3.10",
    "pillow>=10.2.0",
    "opencv-python>=4.9.0.80",
    "numpy>=1.26.3",
    
    # AI/ML
    "openai>=1.10.0",
    "langgraph>=0.0.26",
    "langchain>=0.1.4",
    "langchain-openai>=0.0.5",
    
    # Configuration and Utilities
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    
    # Export
    "pandas>=2.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.92.2",
    "black>=23.12.1",
    "ruff>=0.1.11",
    "mypy>=1.8.0",
]

[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
