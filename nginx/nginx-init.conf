# Initial nginx config for obtaining SSL certificate
# This is used before SSL certificates exist

events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name boxitracker.com www.boxitracker.com;
        
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        
        location / {
            return 200 'Server is running. Waiting for SSL certificate...';
            add_header Content-Type text/plain;
        }
    }
}
